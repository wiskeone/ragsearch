{% load i18n %}
{% load static %}
<div class="full-width-form">
    <form method="post" id="documentEditForm">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">{% trans "Название" %}</label>
            {{ form.title }}
            <div class="text-danger small" id="title-errors"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">{% trans "Описание" %}</label>
            {{ form.description }}
            <div class="text-danger small" id="description-errors"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">{% trans "Теги (через запятую)" %}</label>
            {{ form.tags }}
            <div class="text-danger small" id="tags-errors"></div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> {% trans "Сохранить" %}
            </button>
        </div>
    </form>
</div>
