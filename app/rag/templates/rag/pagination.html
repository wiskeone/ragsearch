{% load i18n %}
{% if page.has_other_pages %}
<nav>
    <ul class="pagination">
        {% if page.has_previous %}
        <li class="page-item"><a class="page-link" href="?page=1">{% trans "« Первая" %}</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ page.previous_page_number }}">{% trans "Предыдущая" %}</a></li>
        {% endif %}
        <li class="page-item active"><span class="page-link">{{ page.number }}</span></li>
        {% if page.has_next %}
        <li class="page-item"><a class="page-link" href="?page={{ page.next_page_number }}">{% trans "Следующая" %}</a></li>
        <li class="page-item"><a class="page-link" href="?page={{ page.paginator.num_pages }}">{% trans "Последняя »" %}</a></li>
        {% endif %}
    </ul>
</nav>
{% endif %}
