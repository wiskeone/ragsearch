{% extends 'rag/base.html' %}
{% load i18n %}

{% block title %}Вход - RAG Search{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">{% trans "Вход в систему" %}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">{% trans "Войти" %}</button>
                    <a href="{% url 'rag:register' %}" class="btn btn-link">{% trans "Зарегистрироваться" %}</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
