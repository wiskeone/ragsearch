{% load static %}
<div class="full-width-form">
    <form method="post" id="documentUploadForm" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.collection }}   <!-- скрытое поле коллекции (заполняется через JS) -->

        <div class="mb-3">
            <label class="form-label">Общий заголовок (опционально)</label>
            {{ form.title }}
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            {{ form.description }}
        </div>
        <div class="mb-3">
            <label class="form-label">Теги (через запятую)</label>
            {{ form.tags }}
        </div>

        <div class="drop-zone" id="dropZone">
            {{ form.files }}
            <div class="drop-zone-content">
                <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
                <p class="mt-2 mb-1 fw-semibold">Перетащите файлы сюда</p>
                <p class="text-secondary small">или нажмите для выбора</p>
                <p class="text-secondary small mt-2">Поддерживаются PDF, DOCX, TXT, MD</p>
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="d-flex justify-content-end mt-4">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-cloud-upload me-1"></i> Загрузить
            </button>
        </div>
    </form>
</div>
