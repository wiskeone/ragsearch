name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check app/ --exit-zero   # пока только фиксируем, не валим

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -f Dockerfile.cpu -t ragsearch-cpu .
      - name: Check migrations are in sync with models
        run: |
          docker run --rm \
            -e DEBUG=True -e SECRET_KEY=ci-secret-key \
            -e ENCRYPTION_KEY=L9QlwglJGbDA81WZ66Ss9mqYBbDSXb-kPqbi4HDdoyA=\
            ragsearch-cpu bash -lc "python manage.py makemigrations --check --dry-run --settings=config.test_settings"
      - name: Django system check
        run: |
          docker run --rm \
            -e DEBUG=True -e SECRET_KEY=ci-secret-key \
            -e ENCRYPTION_KEY=L9QlwglJGbDA81WZ66Ss9mqYBbDSXb-kPqbi4HDdoyA=\
            ragsearch-cpu bash -lc "python manage.py check --settings=config.test_settings"
      - name: Run light tests inside the image
        run: |
          docker run --rm \
            -e DEBUG=True \
            -e SECRET_KEY=ci-secret-key \
            -e ENCRYPTION_KEY=L9QlwglJGbDA81WZ66Ss9mqYBbDSXb-kPqbi4HDdoyA=nerate_encryption_key.sh 2>/dev/null || python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") \
            -e DB_ENGINE=django.db.backends.sqlite3 \
            ragsearch-cpu bash -lc "python manage.py test rag.tests -v 2 --settings=config.test_settings 2>/dev/null || python manage.py test rag.tests -v 2"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose config
        run: docker compose config -q
