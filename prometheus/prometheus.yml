global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django'
    static_configs:
      - targets: ['web:8000']
    metrics_path: '/metrics'

  # NOTE: 5555 слушает только контейнер flower; воркеры метрики на
  # 5555 не отдают. Для метрик воркеров — prometheus_flask_exporter
  # внутри задач либо flower's /metrics (ниже).
  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: '/metrics'

  # NOTE: redis_exporter/postgres_exporter не входят в docker-compose —
  # эти таргеты мёртвые (prometheus их не мог собрать). Раскомментировать
  # после добавления экспортеров:
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:9121']
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['db:9187']